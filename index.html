
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="calcuator.css">
</head>

<body>

    <div class="container">

        <h2 class="heading">💌 Modern Calculator</h2>

        <span>Simple . Fast . Responsive</span>

        <p>🌈 Built with HTML, CSS JavaScript</p>

        <div class="main">

            <input
                id="input-box"
                type="text"
                placeholder="0"
                aria-label="Calculator display"
                readonly
            >
            <div>
                <button type="button" class="btn">AC</button>
                <button type="button" class="btn">DEL</button>
                <button type="button">%</button>
                <button type="button">/</button>
            </div>

            <div>
                <button type="button">7</button>
                <button type="button">8</button>
                <button type="button">9</button>
                <button type="button">*</button>
            </div>
            <div>
                <button type="button">4</button>
                <button type="button">5</button>
                <button type="button">6</button>
                <button type="button">-</button>
            </div>
            <div>
                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>
                <button type="button">+</button>
            </div>

            <div>
                <button type="button">00</button>
                <button type="button">0</button>
                <button type="button">.</button>
                <button type="button" class="btn">=</button>
            </div>

        </div>

        <footer>!------ made by leesha vani ------!</footer>

    </div>
    <script src="calcuator.js"></script>

</body>

</html>
